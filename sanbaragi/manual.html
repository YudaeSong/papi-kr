<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산바라기 사용자 매뉴얼</title>
<link rel="icon" href="sanbaragi-icon.png">
<style>
@font-face{font-family:"MaruBuri";src:url("fonts/MaruBuri-SemiBold.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"MaruBuri";src:url("fonts/MaruBuri-Bold.woff2") format("woff2");font-weight:700 900;font-display:swap}
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d2125; --sub:#5a626d; --line:#e2ddd1;
  --accent:#1f6f5c; --accent-soft:#e2f0ea; --mark:#c0392b;
  --tip:#1f6f5c; --tip-bg:#e6f3ee; --warn:#a4481d; --warn-bg:#fbefe7;
  --side:#fbfaf6; --hl:#fff1a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1e2125; --ink:#e6e8eb; --sub:#a1a8b2; --line:#30343a;
    --accent:#5cc3a5; --accent-soft:#1d332d; --mark:#e5584a;
    --tip:#5cc3a5; --tip-bg:#1b2f29; --warn:#f0a07a; --warn-bg:#36251e;
    --side:#1a1d20; --hl:#5b4d10;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e6e8eb; --sub:#a1a8b2; --line:#30343a;
  --accent:#5cc3a5; --accent-soft:#1d332d; --mark:#e5584a;
  --tip:#5cc3a5; --tip-bg:#1b2f29; --warn:#f0a07a; --warn-bg:#36251e;
  --side:#1a1d20; --hl:#5b4d10;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "MaruBuri","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.layout{display:flex;min-height:100vh}
nav.toc{width:270px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 14px}
nav.toc h1{font-size:18px;margin:0 0 2px}
nav.toc .meta{font-size:12px;color:var(--sub);margin-bottom:12px}
nav.toc input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc li.ch>a{display:block;font-weight:700;font-size:14px;padding:6px 6px;border-radius:6px;color:var(--ink);text-decoration:none}
nav.toc li.sec>a{display:block;font-size:13px;padding:3px 6px 3px 20px;color:var(--sub);text-decoration:none;border-radius:6px}
nav.toc a:hover,nav.toc a.on{background:var(--accent-soft);color:var(--accent)}
main{flex:1;min-width:0;padding:28px 32px 120px;max-width:1100px}
.cover{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;margin-bottom:28px}
.cover h1{margin:0 0 6px;font-size:28px}
.cover p{margin:4px 0;color:var(--sub)}
section.chapter{margin-bottom:46px}
section.chapter>h2{font-size:23px;margin:0 0 6px;padding-bottom:8px;border-bottom:3px solid var(--accent)}
section.chapter>.intro{color:var(--sub);margin:8px 0 18px}
article.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0}
article.sec h3{margin:0 0 6px;font-size:18px}
article.sec .desc{margin:0 0 14px;color:var(--sub)}
.body{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.shots{display:flex;gap:18px;flex-wrap:wrap;flex:0 1 auto;min-width:0;max-width:100%}
figure.shot{margin:0;width:411px;max-width:100%}
.phone{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.12);background:#000;line-height:0}
.phone img{width:100%;height:auto;display:block}
.phone .ph{line-height:1.5;aspect-ratio:411/891;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:14px;background:repeating-linear-gradient(45deg,#2a2d31 0 12px,#24272b 12px 24px)}
.phone .mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--mark);color:#fff;font:700 13px/26px "MaruBuri",system-ui;text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.4)}
figure.shot figcaption{font-size:13px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.5}
.text{flex:1;min-width:260px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;margin:0 0 10px}
.steps .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--mark);color:#fff;font:700 12px/24px "MaruBuri",system-ui;text-align:center;margin-top:2px}
.steps .n.plain{background:var(--accent)}
.steps li>span>b:first-child{display:block}
.box{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.box.tip{background:var(--tip-bg);border-left:4px solid var(--tip)}
.box.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.box .h{font-weight:700;margin-right:6px}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.hidden{display:none!important}
.empty{color:var(--sub);padding:40px 0;text-align:center}
.topbar{display:none}
@media (max-width:860px){
  .layout{display:block}
  nav.toc{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.25)}
  nav.toc.open{transform:none}
  .topbar{display:flex;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;gap:10px;align-items:center}
  .topbar button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
  main{padding:18px 16px 100px}
  article.sec{padding:16px}
  figure.shot{width:100%;max-width:411px}
}
@media print{
  nav.toc,.topbar{display:none!important}
  main{padding:0;max-width:none}
  article.sec{break-inside:avoid;box-shadow:none}
  section.chapter{break-before:page}
  figure.shot{width:62mm}
  .phone{box-shadow:none}
}
/* 목차 스크롤바 — 배경은 투명, 막대만 보인다 */
nav.toc{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
nav.toc::-webkit-scrollbar{width:8px}
nav.toc::-webkit-scrollbar-track{background:transparent}
nav.toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
/* 문서 전환 탭 — 세 문서가 같은 탭을 쓴다 */
.doc-tabs{background:var(--accent-soft);border-bottom:3px solid var(--accent);padding:12px 16px 0}
.doc-tabs>div{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.doc-brand{display:flex;align-items:center;gap:10px;align-self:center;padding-bottom:12px;color:var(--ink);font-size:24px;font-weight:700;line-height:1.2;text-decoration:none;word-break:keep-all}
.doc-brand img{width:44px;height:auto;border-radius:10px;display:block}
.doc-tabs .tabs{flex:1 1 520px;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.doc-tabs .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:66px;padding:8px 6px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card);color:var(--accent);font-size:19px;font-weight:700;line-height:1.25;text-align:center;text-decoration:none;word-break:keep-all;overflow-wrap:break-word}
.doc-tabs .tabs a small{margin-top:3px;color:var(--sub);font-size:13px;font-weight:600}
.doc-tabs .tabs a:hover{box-shadow:inset 0 -3px 0 var(--accent)}
.doc-tabs a:focus-visible{outline:3px solid var(--mark,var(--accent));outline-offset:-3px}
.doc-tabs .tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.doc-tabs .tabs a[aria-current="page"]:hover{box-shadow:none}
.doc-tabs .tabs a[aria-current="page"] small{color:var(--bg);opacity:.9}
@media (max-width:640px){.doc-tabs{padding:8px 8px 0}.doc-brand{font-size:20px;padding:0 0 2px 4px}.doc-brand img{width:32px;border-radius:8px}.doc-tabs .tabs{flex-basis:100%;gap:4px}.doc-tabs .tabs a{min-height:62px;padding:6px 3px;font-size:15px}.doc-tabs .tabs a small{font-size:12px}}
@media print{.doc-tabs{display:none}}
</style>
</head>
<body>
<nav class="doc-tabs" id="docTabs" aria-label="안내 문서 선택"><div><a class="doc-brand" href="index.html"><img src="sanbaragi-icon.png" alt="" width="44" height="43">산바라기</a><div class="tabs"><a href="index.html">이용하기<small>튜토리얼</small></a><a href="features.html">한눈에 기능보기<small>기능 목록</small></a><a href="manual.html" aria-current="page">사용자 매뉴얼<small>화면별 설명</small></a></div></div></nav>
<div class="topbar"><button id="tocBtn" type="button">☰ 목차</button><b>산바라기 사용자 매뉴얼</b></div>
<div class="layout">
  <nav class="toc" id="toc">
    <h1>산바라기 사용자 매뉴얼</h1>
    <div class="meta" id="meta"></div>
    <input id="q" type="search" placeholder="찾기 (예: 오프라인 지도)">
    <ol id="tocList"></ol>
  </nav>
  <main id="main"></main>
</div>
<script src="search.js"></script>
<script src="manual-data.js"></script>
<script>
(function(){
  const M = window.MANUAL;
  const main = document.getElementById('main');
  const tocList = document.getElementById('tocList');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 설명 문자열 안의 **굵게** 만 허용
  const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

  document.getElementById('meta').textContent = `${M.version} · ${M.updated}`;

  const cover = document.createElement('div');
  cover.className = 'cover';
  cover.innerHTML = `<h1>${esc(M.title)}</h1>${(M.intro||[]).map(p=>`<p>${rich(p)}</p>`).join('')}`;
  main.appendChild(cover);

  M.chapters.forEach((ch, ci) => {
    const chNo = ci + 1;
    const sec = document.createElement('section');
    sec.className = 'chapter';
    sec.id = ch.id;
    sec.innerHTML = `<h2>${chNo}. ${esc(ch.title)}</h2>${ch.intro?`<p class="intro">${rich(ch.intro)}</p>`:''}`;
    const li = document.createElement('li');
    li.className = 'ch';
    li.innerHTML = `<a href="#${ch.id}">${chNo}. ${esc(ch.title)}</a>`;
    tocList.appendChild(li);

    ch.sections.forEach((s, si) => {
      const no = `${chNo}-${si+1}`;
      const art = document.createElement('article');
      art.className = 'sec';
      art.id = s.id;
      const shots = (s.shots||[]).filter(sh => sh.img).map(sh => {
        const marks = (sh.marks||[]).map(([n,x,y]) => `<span class="mk" style="left:${x}%;top:${y}%">${n}</span>`).join('');
        const img = sh.img
          ? `<img src="screens/${esc(sh.img)}.webp" alt="${esc(sh.caption||s.title)}" loading="lazy" onerror="this.outerHTML='<div class=ph>화면 준비 중</div>'">`
          : `<div class="ph">화면 준비 중</div>`;
        return `<figure class="shot"><div class="phone">${img}${marks}</div>${sh.caption?`<figcaption>${rich(sh.caption)}</figcaption>`:''}</figure>`;
      }).join('');
      const steps = (s.steps||[]).length ? `<ol class="steps">${s.steps.map(([n,t,d]) =>
        `<li><span class="n${typeof n==='number'?'':' plain'}">${esc(n)}</span><span><b>${rich(t)}</b>${d?rich(d):''}</span></li>`).join('')}</ol>` : '';
      const boxes = (s.tips||[]).map(t=>`<div class="box tip"><span class="h">💡 팁</span>${rich(t)}</div>`).join('')
                  + (s.warns||[]).map(t=>`<div class="box warn"><span class="h">⚠ 주의</span>${rich(t)}</div>`).join('');
      art.innerHTML = `<h3>${no}. ${esc(s.title)}</h3>${s.desc?`<p class="desc">${rich(s.desc)}</p>`:''}
        <div class="body">${shots?`<div class="shots">${shots}</div>`:''}<div class="text">${steps}${boxes}</div></div>`;
      art.dataset.search = DocSearch.norm([ch.title, s.title, s.desc, ...(s.steps||[]).flat(), ...(s.tips||[]), ...(s.warns||[])].join(' '));
      sec.appendChild(art);
      const sli = document.createElement('li');
      sli.className = 'sec';
      sli.dataset.target = s.id;
      sli.innerHTML = `<a href="#${s.id}">${no}. ${esc(s.title)}</a>`;
      tocList.appendChild(sli);
    });
    main.appendChild(sec);
  });

  const empty = document.createElement('p');
  empty.className = 'empty hidden';
  empty.textContent = '찾는 내용이 없습니다.';
  main.appendChild(empty);

  // 찾기 — 절 단위로 거른다. 띄어쓰기는 무시한다(검색어·본문 양쪽에서 공백 제거)
  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    const match = DocSearch.matcher(q.value);
    const v = !!match;
    let any = false;
    document.querySelectorAll('section.chapter').forEach(sec => {
      let chAny = false;
      sec.querySelectorAll('article.sec').forEach(a => {
        const hit = !match || match(a.dataset.search);
        a.classList.toggle('hidden', !hit);
        document.querySelector(`li.sec[data-target="${a.id}"]`).classList.toggle('hidden', !hit);
        chAny ||= hit;
      });
      sec.classList.toggle('hidden', !chAny);
      any ||= chAny;
    });
    cover.classList.toggle('hidden', !!v);
    empty.classList.toggle('hidden', any);
  });

  // 목차 현재 위치 표시
  const links = new Map([...document.querySelectorAll('nav.toc a')].map(a => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { links.forEach(a => a.classList.remove('on')); links.get(e.target.id)?.classList.add('on'); }
  }), {rootMargin: '0px 0px -70% 0px'});
  document.querySelectorAll('article.sec').forEach(a => io.observe(a));

  // 좁은 화면 목차 열기/닫기
  const toc = document.getElementById('toc');
  document.getElementById('tocBtn').addEventListener('click', () => toc.classList.toggle('open'));
  toc.addEventListener('click', e => { if (e.target.tagName === 'A') toc.classList.remove('open'); });
})();
</script>
</body>
</html>
