<!DOCTYPE html>
<!-- 자동 생성: node tools/spec-map-sync/sync.js --update-viewer (원본: InSearch docs/data-model-erd.html). 직접 수정하지 말 것 — 웹 전용 변경은 erd-app.js·web.css -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.papi.kr; base-uri 'none'; form-action 'none'">
<title>ERD — App Spec Map</title>
<style>
  :root {
    --paper: #f5f7fa;
    --paper-raised: #ffffff;
    --paper-sunken: #eef2f7;
    --ink: #1a202c;
    --ink-soft: #2d3748;
    --muted: #718096;
    --line: #cbd5e0;
    --line-strong: #a0aec0;
    --accent: #2563eb;
    --accent-strong: #1e40af;
    --accent-tint: #eff6ff;
    --accent-2: #7c3aed;
    --accent-2-tint: #faf5ff;
    --pk: #dc2626;
    --pk-tint: #fef2f2;
    --fk: #0891b2;
    --fk-tint: #ecf0ff;
    --uk: #7c3aed;
    --uk-tint: #faf5ff;
    --code-bg: #f1f5f9;
    --shadow: 0 1px 3px rgba(26, 32, 44, 0.12), 0 4px 12px -8px rgba(26, 32, 44, 0.2);
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f172a;
      --paper-raised: #1e293b;
      --paper-sunken: #0f172a;
      --ink: #f1f5f9;
      --ink-soft: #cbd5e0;
      --muted: #94a3b8;
      --line: #334155;
      --line-strong: #475569;
      --accent: #60a5fa;
      --accent-strong: #93c5fd;
      --accent-tint: #0c2d57;
      --accent-2: #c084fc;
      --accent-2-tint: #3f224a;
      --pk: #f87171;
      --pk-tint: #3d2421;
      --fk: #06b6d4;
      --fk-tint: #0c3f4a;
      --uk: #c084fc;
      --uk-tint: #3f224a;
      --code-bg: #1e293b;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 6px 20px -8px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f172a;
    --paper-raised: #1e293b;
    --paper-sunken: #0f172a;
    --ink: #f1f5f9;
    --ink-soft: #cbd5e0;
    --muted: #94a3b8;
    --line: #334155;
    --line-strong: #475569;
    --accent: #60a5fa;
    --accent-strong: #93c5fd;
    --accent-tint: #0c2d57;
    --accent-2: #c084fc;
    --accent-2-tint: #3f224a;
    --pk: #f87171;
    --pk-tint: #3d2421;
    --fk: #06b6d4;
    --fk-tint: #0c3f4a;
    --uk: #c084fc;
    --uk-tint: #3f224a;
    --code-bg: #1e293b;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 6px 20px -8px rgba(0, 0, 0, 0.6);
  }
  :root[data-theme="light"] {
    --paper: #f5f7fa;
    --paper-raised: #ffffff;
    --paper-sunken: #eef2f7;
    --ink: #1a202c;
    --ink-soft: #2d3748;
    --muted: #718096;
    --line: #cbd5e0;
    --line-strong: #a0aec0;
    --accent: #2563eb;
    --accent-strong: #1e40af;
    --accent-tint: #eff6ff;
    --accent-2: #7c3aed;
    --accent-2-tint: #faf5ff;
    --pk: #dc2626;
    --pk-tint: #fef2f2;
    --fk: #0891b2;
    --fk-tint: #ecf0ff;
    --uk: #7c3aed;
    --uk-tint: #faf5ff;
    --code-bg: #f1f5f9;
    --shadow: 0 1px 3px rgba(26, 32, 44, 0.12), 0 4px 12px -8px rgba(26, 32, 44, 0.2);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 700;
    color: var(--ink);
    text-wrap: balance;
    margin: 0;
  }
  code, .mono, .schema td.col, .schema td.ty, table.spec td.mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
  }
  a { color: var(--accent-strong); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  p { margin: 0 0 0.75em; max-width: 68ch; }
  .lede { max-width: 62ch; color: var(--ink-soft); }

  /* ---------- title block ---------- */
  .titleblock {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: space-between;
    align-items: flex-end;
    padding: 32px clamp(20px, 4vw, 48px) 24px;
    border-bottom: 2px solid var(--accent);
    background: var(--paper-raised);
    box-shadow: var(--shadow);
  }
  .titleblock-main { position: relative; max-width: 640px; }
  .eyebrow {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-strong);
    background: var(--accent-tint);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 4px 10px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .titleblock h1 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); line-height: 1.15; margin-bottom: 8px; }
  .titleblock .lede { margin-top: 10px; font-size: 0.95rem; }
  .titleblock-meta {
    position: relative;
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 18px;
    margin: 0;
    padding: 14px 18px;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    border-radius: var(--radius);
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .titleblock-meta dt { color: var(--muted); font-weight: 700; }
  .titleblock-meta dd { margin: 0; font-family: ui-monospace, monospace; color: var(--ink); font-size: 0.8rem; }

  /* ---------- shell / nav ---------- */
  .shell {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 0;
    align-items: start;
  }
  .toc {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 16px 40px 20px;
    border-right: 1px solid var(--line);
    font-size: 0.85rem;
    background: var(--paper-raised);
  }
  .toc-title {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 700;
  }
  .toc ol { list-style: none; margin: 0 0 20px; padding: 0; }
  .toc li { margin: 0; }
  .toc a {
    display: block;
    padding: 6px 10px;
    margin: 2px 0;
    border-radius: 3px;
    color: var(--ink-soft);
    text-decoration: none;
    border-left: 3px solid transparent;
    transition: all 0.15s ease;
  }
  .toc a:hover { background: var(--paper-sunken); color: var(--accent); border-left-color: var(--accent); }
  .toc .toc-group { border-left: 2px solid var(--line); padding-left: 0; margin-left: 8px; }
  .toc .toc-group a { font-size: 0.8rem; padding-left: 14px; color: var(--muted); }

  main {
    min-width: 0;
    padding: 12px clamp(20px, 4vw, 48px) 80px;
  }
  section { padding-top: 52px; scroll-margin-top: 16px; border-top: 1px solid var(--line); }
  section:first-of-type { border-top: none; padding-top: 0; }
  .section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .section-num {
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    color: var(--accent-strong);
    background: var(--accent-tint);
    border-radius: 3px;
    padding: 3px 8px;
    font-weight: 700;
  }
  section h2 { font-size: 1.5rem; }
  .section-note { color: var(--muted); font-size: 0.9rem; margin: 8px 0 22px; max-width: 70ch; }

  .callout {
    border: 1px solid var(--line-strong);
    border-left: 4px solid var(--accent);
    background: var(--paper-raised);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 0.9rem;
    margin: 16px 0 28px;
    box-shadow: var(--shadow);
  }
  .callout.warn { border-left-color: var(--accent-2); }
  .callout strong { color: var(--ink); }
  .callout p:last-child { margin-bottom: 0; }

  /* ---------- overview trio ---------- */
  .trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0 10px; }
  .trio-card {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .trio-card:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15); }
  .trio-card h3 { font-size: 1.05rem; margin-bottom: 8px; }
  .trio-card p { font-size: 0.86rem; color: var(--ink-soft); margin-bottom: 0; }
  .trio-card .tag { margin-bottom: 10px; }

  /* ---------- diagram frame ---------- */
  .diagram-frame {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
    padding: 20px 16px;
    margin: 20px 0 22px;
  }
  .diagram-frame pre.mermaid { margin: 0; min-width: 680px; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px 26px; margin: 0 0 10px; font-size: 0.82rem; color: var(--ink-soft); }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch { width: 24px; height: 2px; background: var(--ink-soft); display: inline-block; }
  .legend-swatch.dotted { background: none; border-top: 2px dotted var(--muted); }

  /* ---------- tags ---------- */
  .tag {
    display: inline-block;
    font-family: ui-monospace, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 7px;
    border-radius: 3px;
    line-height: 1.5;
    text-transform: uppercase;
  }
  .tag-pk { background: var(--pk-tint); color: var(--pk); }
  .tag-fk { background: var(--fk-tint); color: var(--fk); }
  .tag-uk { background: var(--uk-tint); color: var(--uk); }
  .tag-null { background: transparent; color: var(--muted); border: 1px solid var(--line-strong); }
  .tag-default { background: var(--paper-sunken); color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .tag-cascade { background: var(--accent-2-tint); color: var(--accent-2); }

  /* ---------- entity cards ---------- */
  .entity-index { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 6px 0 26px; }
  .entity-index a {
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
    text-decoration: none;
    color: var(--ink-soft);
    background: var(--paper-sunken);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 10px;
    transition: all 0.15s ease;
  }
  .entity-index a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }

  .entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; }
  .entity-card {
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-margin-top: 20px;
    transition: box-shadow 0.15s ease;
  }
  .entity-card:hover { box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12); }
  .entity-card > header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    background: var(--accent-tint);
    border-bottom: 1px solid var(--line-strong);
  }
  .entity-card > header h4 { font-family: ui-monospace, monospace; font-size: 0.96rem; color: var(--accent-strong); font-weight: 700; }
  .entity-card > header .entity-meta { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, monospace; text-align: right; }
  .entity-card .entity-desc { padding: 12px 16px 0; font-size: 0.84rem; color: var(--ink-soft); }
  table.schema { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.schema th {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 8px;
    font-weight: 700;
  }
  table.schema td { padding: 6px 16px; border-top: 1px solid var(--line); vertical-align: top; }
  table.schema tr:first-child td { border-top: none; }
  table.schema td.col { color: var(--ink); white-space: nowrap; font-weight: 500; }
  table.schema td.ty { color: var(--muted); white-space: nowrap; font-family: ui-monospace, monospace; }
  table.schema td.note { color: var(--ink-soft); font-size: 0.8rem; }
  table.schema tfoot td { padding: 10px 16px 14px; font-size: 0.76rem; color: var(--muted); border-top: 1px dashed var(--line); }

  /* ---------- generic content table ---------- */
  .table-wrap { overflow-x: auto; margin: 16px 0 26px; border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); }
  table.spec { width: 100%; border-collapse: collapse; font-size: 0.86rem; background: var(--paper-raised); }
  table.spec caption { text-align: left; padding: 12px 16px; font-size: 0.78rem; color: var(--muted); border-bottom: 1px solid var(--line); }
  table.spec th { text-align: left; padding: 11px 16px; background: var(--paper-sunken); color: var(--ink-soft); font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--line-strong); white-space: nowrap; font-weight: 700; }
  table.spec td { padding: 11px 16px; border-top: 1px solid var(--line); }
  table.spec tr:first-child td { border-top: none; }
  table.spec td.num { font-variant-numeric: tabular-nums; }

  footer.page-foot { padding: 32px clamp(20px, 4vw, 48px) 60px; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--line); }

  @media (max-width: 920px) {
    .shell { grid-template-columns: 1fr; }
    .toc { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 16px 20px; }
    .toc-title { width: 100%; }
    .toc ol { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
    .toc .toc-group { display: none; }
    .titleblock { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
<link rel="stylesheet" href="web.css">
</head>
<body class="sm-erd">
<div id="smLock" hidden>
  <form id="smLockForm" autocomplete="off">
    <h1>🗄️ ERD</h1>
    <p>관리자 암호를 입력하세요.</p>
    <input id="smPw" type="password" autocomplete="current-password" aria-label="관리자 암호" required>
    <button id="smBtn" type="submit">열기</button>
    <p id="smLockMsg" role="alert"></p>
  </form>
</div>
<div id="smErdBar" hidden><a id="smBack" href="./">⬅ Spec Map</a><span id="smErdState"></span><button id="smReload" type="button">🔄 다시 조회</button></div>
<div class="titleblock">
  <div class="titleblock-main">
    <span class="eyebrow" id="hdEyebrow"></span>
    <h1 id="hdTitle"></h1>
    <p class="lede" id="hdLede"></p>
  </div>
  <dl class="titleblock-meta" id="hdMeta"></dl>
</div>

<div class="shell">
  <nav class="toc" aria-label="목차">
    <p class="toc-title">목차</p>
    <ol id="toc"></ol>
  </nav>
  <main id="main"></main>
</div>

<footer class="page-foot" id="hdFooter"></footer>

<script src="config.js"></script>
<script src="erd-app.js"></script>
</body>
</html>
